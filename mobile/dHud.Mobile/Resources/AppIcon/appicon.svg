    <path d="M28 46 V30 H44"/>
    <path d="M84 30 H100 V46"/>
    <path d="M100 82 V98 H84"/>
    <path d="M44 98 H28 V82"/>
  </g>

  <!-- Nabız / sıcaklık çizgisi -->
