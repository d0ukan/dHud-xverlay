name: Release

# `v1.0.0` gibi bir etiket (tag) push'landığında tek dosyalık exe ve kurulum dosyası derlenir,
# GitHub Release olarak yayınlanır.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Yayın derlemesi
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish -c Release -p:Version="$VERSION"
          # Release dosyasında sürüm görünsün (uygulama içi güncelleme dHud-<sürüm>.exe adını arar).
          cp bin/Release/publish/CpuGpuOverlay.exe "bin/Release/publish/dHud-$VERSION.exe"

      - name: Inno Setup kur
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Kurulum dosyası derle
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\dHud.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release oluştur
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "bin/Release/publish/dHud-$VERSION.exe" \
            "bin/Release/installer/dHud-Setup-$VERSION.exe" \
            --title "dHud $GITHUB_REF_NAME" --generate-notes
