name: Release

# `v1.0.0` gibi bir etiket (tag) push'landığında tek dosyalık exe derlenir ve GitHub Release olarak yayınlanır.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Yayın derlemesi
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish -c Release -p:Version="$VERSION"

      - name: Release oluştur
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bin/Release/publish/CpuGpuOverlay.exe \
            --title "dHud $GITHUB_REF_NAME" --generate-notes
